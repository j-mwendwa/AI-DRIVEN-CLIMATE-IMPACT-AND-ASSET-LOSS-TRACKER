[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "climate-ner"
version = "0.1.0"
description = "Fine-tuned INDUS (nasa-smd-ibm-v0.1) for Climate Change NER"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "datasets>=2.18.0",
    "accelerate>=0.28.0",
    "seqeval>=1.2.2",
    "evaluate>=0.4.1",
    "numpy>=1.26.0",
]

[tool.setuptools.packages.find]
where = ["src"]
